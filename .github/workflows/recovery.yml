name: RECOVERY

on:
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'RECOVERY URL'
        required: true
        default: 'https://files.catbox.moe/(RECOMMENDED)'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git wget lz4 tar openssl python3 ca-certificates file xxd

      - name: Fetch image
        run: |
          set -euxo pipefail
          ls -la
          wget -O recovery.img "${{ github.event.inputs.RECOVERY_URL }}"
          ls -lh recovery.img
          file recovery.img

      - name: Patch Process-1
        run: |
          set -euxo pipefail
          chmod +x script1.sh magiskboot
          ./script1.sh recovery.img
          ls -lh

      - name: Patch Process-2
        run: |
          set -euxo pipefail
          chmod +x script2.sh
          ./script2.sh
          ls -lh r-patched.img

      - name: Create AVB footer
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os, subprocess, sys
          if not os.path.exists("r-patched.img"):
              print("r-patched.img missing")
              sys.exit(1)
          if not os.path.exists("phh.pem"):
              print("phh.pem missing")
              sys.exit(1)
          PY

          python3 avbtool extract_public_key --key phh.pem --output phh.pub.bin || true
          python3 avbtool add_hash_footer \
            --partition_name recovery \
            --partition_size "$(wc -c < recovery.img)" \
            --image r-patched.img \
            --key phh.pem \
            --algorithm SHA256_RSA4096 || true

      - name: Prepare output
        run: |
          set -euxo pipefail
          mkdir -p output
          cp r-patched.img output/recovery.img
          tar -C output -cvf output/fastbootd-recovery.tar recovery.img
          md5sum output/fastbootd-recovery.tar | awk '{print $1}' > output/fastbootd-recovery.tar.md5

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.md5
          name: Patched-Recovery
          tag_name: ${{ github.run_id }}
